name: Validate VYRA
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['website/downloads/**', 'website/updates/latest.json']
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: node --check web/app.js
      - run: node --check clips-worker/static/connections.js
      - run: node --check clips-worker/static/post-assistant.js
      - run: node --test tests/oauth-relay.test.mjs
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r clips-worker/requirements.txt pytest httpx
      - run: python -m pytest clips-worker/tests -q
