name: Build and publish VYRA Windows beta
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vyra-beta-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out VYRA source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run tests
        run: go test ./...
      - name: Build Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o VYRA.exe .
          if ($LASTEXITCODE -ne 0 -or !(Test-Path VYRA.exe)) { throw 'Windows build failed' }
      - name: Create download ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item VYRA.exe, SETUP_CLIPS.bat, README.md -Destination package
          Copy-Item clips-worker -Destination package -Recurse
          Compress-Archive -Path package/* -DestinationPath VYRA-Windows-Beta.zip -CompressionLevel Optimal -Force
      - name: Publish beta release and download links
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v1.0.0-beta.1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.0.0-beta.1 VYRA.exe VYRA-Windows-Beta.zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v1.0.0-beta.1 VYRA.exe VYRA-Windows-Beta.zip --repo $env:GITHUB_REPOSITORY --title 'VYRA Open Beta v1.0.0' --notes 'Free preview for Windows. VYRA chat requires each user’s own OpenAI API key. Clips requires Python and FFmpeg. Unsigned executable. The social posting connectors require separate platform authorization.' --prerelease --latest=false --target main
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
