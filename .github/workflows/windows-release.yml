name: Build and publish VYRA Windows installer
on:
  push:
    branches: [main]
    paths: ['*.go', 'go.mod', 'VERSION', 'web/**', 'winres/**', 'installer/**', 'clips-worker/**', 'scripts/**', 'README.md', 'RELEASE_NOTES.md', 'SETUP_CLIPS.bat', '.github/workflows/windows-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vyra-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test Clips code
        shell: pwsh
        run: |
          python -m pip install -r clips-worker/requirements.txt pytest httpx
          if ($LASTEXITCODE -ne 0) { throw 'Dependency setup failed' }
          python -m pytest clips-worker/tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Clips tests failed' }
      - name: Build and verify release
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -PublishWebsite
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VYRA-Windows-Build
          path: .build/release/*
      - name: Publish versioned beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vyraVersion = (Get-Content VERSION -Raw).Trim()
          $vyraTag = "v$vyraVersion-beta"
          $vyraAssets = @('.build/release/VYRA-Setup.exe','.build/release/VYRA.exe','.build/release/VYRA-Windows-Beta.zip','.build/release/latest.json')
          gh release view $vyraTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $vyraTag @vyraAssets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $vyraTag @vyraAssets --title "VYRA $vyraVersion Open Beta" --notes-file RELEASE_NOTES.md --prerelease --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
      - name: Update website downloads and manifest together
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/downloads website/updates/latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Publish verified VYRA installer downloads'
            if ($LASTEXITCODE -ne 0) { throw 'Download commit failed' }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw 'Source changed during build. Review and rerun release workflow.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Website publishing blocked. Download the build artifact; repository rules may require a pull request.' }
          }
      - name: Trigger Pages for the generated website commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Pages dispatch failed. Vercel can still deploy the website commit.' }
