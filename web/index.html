<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0c1018"><meta name="vyra-session" content="__VYRA_SESSION__"><title>VYRA — Your intelligence, your control</title><link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 256x256"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon.png"><link rel="stylesheet" href="/styles.css"></head>
<body><div id="app" class="app">
<aside id="side" class="sidebar">
  <div class="brand-row"><div class="brand-mark"><img src="/icon.svg" width="44" height="44" alt="VYRA"></div><div class="brand-lockup"><b>VYRA</b><small>PERSONAL INTELLIGENCE</small></div><button class="iconbtn collapse" id="collapse" aria-label="Toggle sidebar" title="Collapse sidebar">☰</button></div>
  <button class="new-chat" id="new-chat"><span class="plus">＋</span> New conversation <kbd>Ctrl K</kbd></button>
  <div class="nav-label">WORKSPACE</div>
  <nav class="primary-nav" aria-label="Main navigation">
  <button data-view="home" class="nav-item selected"><span class="ico">⌂</span><span>Discover</span></button>
  <button data-view="chat" class="nav-item"><span class="ico">◈</span><span>Intelligence</span><span class="nav-dot"></span></button>
  <button data-view="clips" class="nav-item"><span class="ico">▷</span><span>VYRA Clips</span><span class="nav-chip">STUDIO</span></button>
  <button data-view="projects" class="nav-item"><span class="ico">▦</span><span>Projects</span></button>
  <button data-view="agents" class="nav-item"><span class="ico">✧</span><span>AI Tasks</span><span class="nav-chip">LIVE</span></button>
  </nav>
  <div class="section-head"><span class="nav-label">YOUR CONVERSATIONS</span><button id="clear-history" title="Clear history" class="tinybtn">···</button></div>
  <div id="history" class="history"></div>
  <div class="sidebar-bottom"><button data-view="settings" class="nav-item"><span class="ico">⚙</span><span>Settings & connections</span></button><div class="profile"><div class="avatar">V</div><div><strong>Personal workspace</strong><small>Local-first · Private by design</small></div><span class="online"></span></div></div>
</aside>
<div class="main-frame">
<header class="topbar"><div class="breadcrumbs"><span class="dim">WORKSPACE</span><span class="sep">/</span><b id="breadcrumb">DISCOVER</b></div><div class="top-actions"><span id="top-status" class="status-tag"><span class="status-led"></span> OpenAI not connected</span><button id="top-settings" class="top-icon" title="Settings">⚙</button><div class="top-avatar">V</div></div></header>
<main id="main" class="main-content"></main>
<footer class="bottom-bar"><span class="bottom-left"><span class="signal"></span> VYRA SYSTEM · <span id="runtime-label">LOCAL DESKTOP</span></span><span>BUILT FOR WHAT'S NEXT <span class="small-star">✦</span></span></footer>
</div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="voice-overlay" class="voice-overlay" hidden><div class="voice-overlay-head"><span id="voice-label">VYRA VOICE</span><div class="voice-wave"><i></i><i></i><i></i><i></i><i></i></div><button data-action="stop-voice" aria-label="Stop voice and close captions">×</button></div><div id="voice-caption" class="voice-caption" aria-live="polite"></div></div>
<dialog id="task-dialog" class="task-dialog" aria-labelledby="task-dialog-title"></dialog>
<script src="/app.js" defer></script></body></html>
